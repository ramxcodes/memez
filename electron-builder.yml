appId: com.ramxcodes.memez
productName: Memez
directories:
  buildResources: build
files:
  # Everything, then what to leave out. The list has patterns that add files, so the builder
  # no longer adds this one by itself.
  - '**/*'
  - '!**/.vscode/*'
  - '!src/**'
  - '!docs/**'
  - '!.graph/**'
  # Local test files (screenshots, test libraries, logs). Never ship them; a log written
  # during the build also changes size while it is packed and breaks app.asar.
  - '!.proof/**'
  - '!raycast/**'
  - '!vicinae/**'
  # Distro packaging and CI files are not part of the app.
  - '!packaging/**'
  - '!.github/**'
  # The Omarchy shell plugin ships with the app (unpacked, see asarUnpack); its tests do not.
  - '!omarchy/**/*.test.*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!vitest.config.{js,ts,mjs,cjs,mts}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  # transformers.js bundles its own web runtime.
  - '!node_modules/onnxruntime-web/**'
  # Keep each app small: the AI models download on first launch, and each build gets only the
  # ONNX runtime and the image decoder of its own system. A later pattern wins.
  - '!node_modules/onnxruntime-node/bin/napi-v6/**'
  - 'node_modules/onnxruntime-node/bin/napi-v6/${platform}/${arch}/**'
  - '!node_modules/@img/sharp-*/**'
  - 'node_modules/@img/sharp-${platform}-${arch}/**'
  - 'node_modules/@img/sharp-libvips-${platform}-${arch}/**'
  # The app runs the models on the CPU. The Linux GPU providers are about 270 MB.
  - '!node_modules/onnxruntime-node/bin/napi-v6/linux/*/libonnxruntime_providers_{cuda,tensorrt}.so'
  # Same library twice (npm has no symlinks); the binding loads libonnxruntime.1.dylib.
  - '!node_modules/onnxruntime-node/bin/napi-v6/darwin/*/libonnxruntime.1.*.*.dylib'
asarUnpack:
  - resources/**
  # The Omarchy plugin is copied out of the app by path, so it must be a real folder on disk.
  - omarchy/**
  # Native AI runtime and image decoder. They load .node and .dylib files from disk.
  - node_modules/onnxruntime-node/**
  - node_modules/sharp/**
  - node_modules/@img/**
  - node_modules/@napi-rs/**
# Raycast sends memez:// links (see src/main/links.ts).
protocols:
  - name: Memez
    schemes:
      - memez
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
mac:
  target:
    - zip
  category: public.app-category.utilities
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
linux:
  # x64 only: the files patterns above keep only the linux-x64 ONNX runtime and sharp.
  target:
    # Any distro.
    - target: AppImage
      arch: x64
    # Arch Linux package for `sudo pacman -U` (see pacman: below).
    - target: pacman
      arch: x64
    # The unpacked app. The AUR memez-bin package installs from it (packaging/arch/memez-bin).
    - target: tar.gz
      arch: x64
    # Ubuntu and other Debian-based distributions.
    - target: deb
      arch: x64
  # The command is `memez`, and the icon and desktop file are memez.png and memez.desktop.
  executableName: memez
  icon: build/icon.png
  category: Utility
  synopsis: Local meme library with a hotkey search popup
  description: >-
    Local meme library with a hotkey search popup and on-device AI tags. Save a meme once, then
    paste it into any chat in about two seconds.
  maintainer: ramxcodes <ramxcodes@users.noreply.github.com>
  vendor: ramxcodes
  # The `protocols` above add MimeType=x-scheme-handler/memez; to the desktop entries, and the
  # app gets memez:// links (and --show / --toggle-popup) as arguments: Exec=... %U. The
  # entries are set per target (appImage:, pacman:): a `desktop` here would be shared, and
  # electron-builder merges each target's `desktop` into it, so the pacman action would also
  # land in the AppImage.
  # The packages carry the license next to the app (/opt/Memez/LICENSE).
  extraFiles:
    - from: LICENSE
      to: LICENSE
appImage:
  desktop:
    entry:
      GenericName: Meme Library
      Keywords: meme;memes;gif;reaction;sticker;clipboard;paste;
deb:
  # Debian package names use underscores: memez_1.1.0_amd64.deb.
  artifactName: ${name}_${version}_${arch}.${ext}
  # Optional desktop tools. The app works without them; paste and OCR are better with them.
  recommends:
    - wl-clipboard
    - wtype
    - xdotool
    - tesseract-ocr
    - tesseract-ocr-eng
pacman:
  # memez-1.0.0-1-x86_64.pkg.tar.zst, the name pacman itself would give it.
  artifactName: ${name}-${version}-1-x86_64.pkg.tar.zst
  compression: zstd
  # Arch versions of the install scripts: /usr/bin/memez and the sandbox helper only.
  afterInstall: build/linux/pacman-after-install.tpl
  afterRemove: build/linux/pacman-after-remove.tpl
  # The popup action only here: an AppImage has no fixed path for the action to run.
  desktop:
    entry:
      GenericName: Meme Library
      Keywords: meme;memes;gif;reaction;sticker;clipboard;paste;
      Actions: popup;
    desktopActions:
      popup:
        Name: Search Memes
        Exec: /opt/Memez/memez --toggle-popup
  # electron-builder joins synopsis and description with a newline, which breaks pkgdesc in
  # .PKGINFO, so a later --description replaces it. The license also goes where Arch expects it
  # (the path is relative to the project folder, where fpm runs).
  fpm:
    - --description
    - Local meme library with a hotkey search popup and on-device AI tags
    - LICENSE=/usr/share/licenses/memez/LICENSE
  # Libraries Electron and the bundled native modules link against, and bash for the Omarchy
  # plugin scripts. electron-builder's default list names packages Arch no longer has
  # (http-parser, libappindicator-gtk3).
  # Optional tools (wl-clipboard, wtype, xdotool, tesseract, tesseract-data-eng) are optdepends
  # of the AUR package. fpm drops pacman optdepends (its template reads a different key).
  depends:
    - alsa-lib
    - at-spi2-core
    - bash
    - cairo
    - dbus
    - expat
    - glib2
    - glibc
    - gtk3
    - hicolor-icon-theme
    - libcups
    - libgcc
    - libstdc++
    - libx11
    - libxcb
    - libxcomposite
    - libxdamage
    - libxext
    - libxfixes
    - libxkbcommon
    - libxrandr
    - mesa
    - nspr
    - nss
    - pango
    - systemd-libs
    # Electron opens links and folders with xdg-open.
    - xdg-utils
win:
  target:
    - nsis
npmRebuild: false
